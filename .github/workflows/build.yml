name: Build Marzz Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'Marzz-Client-V4-GitHub-ready.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Extract project ZIP
        run: unzip -q Marzz-Client-V4-GitHub-ready.zip -d build-src

      - name: Build Marzz Client
        working-directory: build-src/marzz-client
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-JAR
          path: |
            build-src/marzz-client/build/libs/*.jar
            !build-src/marzz-client/build/libs/*-sources.jar
          if-no-files-found: error
          
